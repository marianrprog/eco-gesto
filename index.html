<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EcoGesto: Guardianes del Parque</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
<script src="https://unpkg.com/ml5@0.12.2/dist/ml5.min.js"></script>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #020a02;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }
  canvas { border: 6px solid #2e5a2e; border-radius: 24px; box-shadow: 0 0 40px rgba(0,255,0,0.2); }
</style>
</head>
<body>

<script>
// --- CONFIGURACIÓN DE NIVELES Y JUEGO ---
const W = 800;
const H = 600;
const LEVEL_THRESHOLD = 100; // Puntos para subir de nivel

// Datos de objetos por nivel
const TRASH_LEVEL_1 = [
  { label:'Botella', bin:'plastico', emoji:'🍶', color:'#3dd6f5' },
  { label:'Papel', bin:'papel', emoji:'📄', color:'#f5c842' },
  { label:'Manzana', bin:'organico', emoji:'🍎', color:'#6fcf50' }
];

const TRASH_LEVEL_2_EXTRA = [
  { label:'Vaso', bin:'plastico', emoji:'🥤', color:'#3dd6f5' },
  { label:'Bolsa', bin:'plastico', emoji:'🛍️', color:'#3dd6f5' },
  { label:'Caja', bin:'papel', emoji:'📦', color:'#f5c842' },
  { label:'Sobre', bin:'papel', emoji:'✉️', color:'#f5c842' },
  { label:'Banana', bin:'organico', emoji:'🍌', color:'#6fcf50' },
  { label:'Sandía', bin:'organico', emoji:'🍉', color:'#6fcf50' }
];

const BINS = [
  { id:'plastico', label:'PLÁSTICO', color:'#3dd6f5', icon:'♻', x:150 },
  { id:'papel', label:'PAPEL', color:'#f5c842', icon:'📋', x:400 },
  { id:'organico', label:'ORGÁNICO', color:'#6fcf50', icon:'🌿', x:650 }
];

// --- VARIABLES ---
let video, handpose, predictions = [];
let state = 'intro'; // intro, levelUp, game, end
let score = 0, level = 1, timer = 60;
let trashItems = [], particles = [];
let heldItem = null;
let modelReady = false;
let smoothX = W/2, smoothY = H/2;
let lastSpawn = 0, timerLast = 0;

new p5(function(p) {

  p.setup = function() {
    let cnv = p.createCanvas(W, H);
    cnv.parent(document.body);
    video = p.createCapture(p.VIDEO, () => {
      handpose = ml5.handpose(video, { flipHorizontal: true }, () => { modelReady = true; });
      handpose.on('predict', results => { predictions = results; });
    });
    video.size(640, 480);
    video.hide();
  };

  p.draw = function() {
    if (state === 'intro') drawIntro();
    else if (state === 'levelUp') drawLevelUp();
    else if (state === 'game') drawGame();
    else drawEnd();
  };

  // --- PANTALLAS ---

  function drawIntro() {
    drawBackground();
    p.textAlign(p.CENTER, p.CENTER);
    p.fill('#6fcf50'); p.textSize(50); p.textStyle(p.BOLD);
    p.text('EcoGesto: Guardianes', W/2, H*0.25);
    
    p.fill(255); p.textSize(18); p.textStyle(p.NORMAL);
    p.text('¡Hola Guardián! El Parque Esperanza está lleno de basura.\nNecesitamos tu ayuda para clasificar los residuos\nusando solo el movimiento de tu mano.', W/2, H*0.42);
    
    p.fill('#ffffffaa'); p.textSize(15);
    p.text('✋ Toca un objeto para recogerlo y llévalo a su caja.', W/2, H*0.55);

    let btnLabel = modelReady ? '¡ACEPTAR MISIÓN!' : 'PREPARANDO EQUIPO...';
    drawButton(W/2, H*0.75, 260, 60, btnLabel);
  }

  function drawLevelUp() {
    drawBackground();
    p.fill('#f5c842'); p.textSize(45); p.text('¡NIVEL COMPLETADO!', W/2, H*0.35);
    p.fill(255); p.textSize(20);
    p.text('¡Increíble! Has limpiado la entrada del parque.\nAhora la misión es más difícil: ¡Hay nuevos residuos!', W/2, H*0.5);
    drawButton(W/2, H*0.75, 260, 60, 'IR AL NIVEL 2');
  }

  function drawGame() {
    p.push();
    p.translate(W, 0); p.scale(-1, 1);
    if (video) p.image(video, 0, 0, W, H);
    p.pop();
    p.background(0, 190);

    // Lógica de juego
    updateTimer();
    updateSpawning();
    handleHandLogic();
    
    // Dibujado
    drawBins();
    updateTrash();
    updateParticles();
    drawCursor();
    drawHUD();

    // Check subida de nivel
    if (level === 1 && score >= LEVEL_THRESHOLD) {
      state = 'levelUp';
      level = 2;
      trashItems = [];
      heldItem = null;
    }
  }

  // --- LÓGICA CORE ---

  function handleHandLogic() {
    if (predictions.length > 0) {
      let index = predictions[0].landmarks[8];
      let tx = p.map(index[0], 0, 640, 0, W);
      let ty = p.map(index[1], 0, 480, 0, H);
      smoothX = p.lerp(smoothX, tx, 0.4);
      smoothY = p.lerp(smoothY, ty, 0.4);

      if (!heldItem) {
        for (let item of trashItems) {
          if (p.dist(smoothX, smoothY, item.x, item.y) < 70) {
            heldItem = item;
            item.held = true;
            break;
          }
        }
      } else {
        heldItem.x = smoothX;
        heldItem.y = smoothY;
        for (let bin of BINS) {
          if (p.dist(heldItem.x, heldItem.y, bin.x, H - 75) < 90) {
            processBinning(heldItem, bin);
            break;
          }
        }
      }
    }
  }

  function processBinning(item, bin) {
    if (item.type.bin === bin.id) {
      score += 10;
      spawnParticles(bin.x, H - 75, bin.color);
    } else {
      score = Math.max(0, score - 5);
      spawnParticles(item.x, item.y, '#ff4444');
    }
    trashItems = trashItems.filter(i => i !== item);
    heldItem = null;
  }

  function updateSpawning() {
    let now = p.millis();
    let interval = level === 1 ? 2200 : 1600; // Más rápido en Nivel 2
    if (now - lastSpawn > interval && trashItems.length < (level + 3)) {
      let pool = level === 1 ? TRASH_LEVEL_1 : [...TRASH_LEVEL_1, ...TRASH_LEVEL_2_EXTRA];
      trashItems.push({ 
        type: p.random(pool), 
        x: p.random(100, W - 100), 
        y: p.random(120, H - 250), 
        held: false 
      });
      lastSpawn = now;
    }
  }

  function updateTimer() {
    let now = p.millis();
    if (now - timerLast >= 1000) { timer--; timerLast = now; }
    if (timer <= 0) state = 'end';
  }

  // --- INTERFAZ Y ELEMENTOS ---

  function drawHUD() {
    p.fill(0, 200); p.noStroke(); p.rect(0, 0, W, 70);
    p.fill('#6fcf50'); p.textSize(22); p.textAlign(p.LEFT);
    p.text(`PUNTOS: ${score}`, 30, 35);
    p.fill('#f5c842'); p.text(`NIVEL: ${level}`, 200, 35);
    p.fill(255); p.textAlign(p.CENTER);
    p.text(`TIEMPO: ${timer}s`, W/2, 35);
    
    // Barra de progreso nivel
    if (level === 1) {
      p.noFill(); p.stroke(255, 50); p.rect(30, 45, 150, 8);
      p.fill('#6fcf50'); p.noStroke(); p.rect(30, 45, p.map(score, 0, 100, 0, 150), 8);
    }
  }

  function drawCursor() {
    p.noFill(); p.stroke(heldItem ? heldItem.type.color : 255);
    p.strokeWeight(3);
    p.ellipse(smoothX, smoothY, 35);
    if (heldItem) {
      p.drawingContext.shadowBlur = 15;
      p.drawingContext.shadowColor = heldItem.type.color;
    }
  }

  function drawBins() {
    BINS.forEach(bin => {
      let active = heldItem && p.dist(smoothX, smoothY, bin.x, H-75) < 90;
      p.fill(bin.color + (active ? '44' : '22'));
      p.stroke(bin.color); p.strokeWeight(active ? 4 : 2);
      p.rect(bin.x - 60, H - 130, 120, 110, 18);
      p.noStroke(); p.fill(255);
      p.textSize(45); p.text(bin.icon, bin.x, H - 90);
      p.textSize(12); p.text(bin.label, bin.x, H - 35);
    });
  }

  function updateTrash() {
    trashItems.forEach(item => {
      p.textSize(item.held ? 75 : 55);
      p.textAlign(p.CENTER, p.CENTER);
      p.text(item.type.emoji, item.x, item.y);
    });
  }

  function drawEnd() {
    drawBackground();
    p.fill(255); p.textSize(50); p.text('MISIÓN FINALIZADA', W/2, H*0.3);
    p.textSize(30); p.fill('#6fcf50');
    p.text(`Recolectaste ${score} unidades de basura`, W/2, H*0.45);
    p.textSize(18); p.fill(255);
    p.text(score >= 150 ? "¡Eres un Héroe del Medio Ambiente!" : "¡Buen trabajo, sigue practicando!", W/2, H*0.55);
    drawButton(W/2, H*0.75, 200, 50, 'REINTENTAR');
  }

  // --- HELPERS ---

  function drawButton(x, y, w, h, txt) {
    let over = p.dist(p.mouseX, p.mouseY, x, y) < w/2;
    p.fill(over ? '#3d8c2d' : '#2a5c2a');
    p.stroke('#6fcf50'); p.strokeWeight(2);
    p.rect(x - w/2, y - h/2, w, h, 20);
    p.noStroke(); p.fill(255); p.textSize(18); p.text(txt, x, y);
  }

  function drawBackground() {
    for(let i = 0; i < H; i++){
      p.stroke(p.lerpColor(p.color('#081208'), p.color('#103518'), i/H));
      p.line(0, i, W, i);
    }
  }

  function spawnParticles(x, y, col) {
    for(let i=0; i<15; i++) particles.push({x, y, vx:p.random(-5,5), vy:p.random(-5,5), life:255, col});
  }

  function updateParticles() {
    for(let i = particles.length-1; i>=0; i--) {
      let pt = particles[i];
      pt.x += pt.vx; pt.y += pt.vy; pt.life -= 10;
      p.fill(pt.col + p.hex(pt.life, 2)); p.noStroke();
      p.ellipse(pt.x, pt.y, 6);
      if(pt.life <= 0) particles.splice(i, 1);
    }
  }

  p.mousePressed = function() {
    if (state === 'intro' && modelReady) state = 'game';
    else if (state === 'levelUp') state = 'game';
    else if (state === 'end') { 
      state = 'intro'; score = 0; level = 1; timer = 60; 
    }
  };

});
</script>
</body>
</html>
